# ArcticCyclone Configuration File

# Data acquisition settings
data:
  default_source: 'ERA5'
  cache_dir: 'data/cache'
  sources:
    ERA5:
      type: 'reanalysis'
      dataset_type: 'surface'
      variables: ['z', 'u', 'v', 't', 'q', 'vo', 'msl']  # Geopotential, wind components, temperature, humidity, vorticity
      levels: [1000, 925, 850, 700, 500]     # Pressure levels in hPa
      grid_resolution: 0.25  # Degrees (0.25° ≈ 28 km)

# Detection settings
detection:
  min_latitude: 65.0  # Minimum latitude (degrees North) for Arctic region
  criteria:
    pressure_minimum:
      enabled: true
      weight: 0.25
      # threshold: 1010.0  # Maximum pressure to consider (hPa)
      gradient_threshold: 1.5  # Minimum pressure gradient (hPa/100km)
    vorticity:
      enabled: true
      weight: 0.30
      threshold: 10.0e-5  # Minimum vorticity (1/s)
      level: 850  # Pressure level for vorticity analysis (hPa)
    closed_contour:
      enabled: false
      weight: 0.10
      contour_interval: 5.0  # Pressure contour interval (hPa)
    wind:
      enabled: true
      weight: 0.40
      # Simple threshold
      min_speed: 20.0  # Minimum wind speed (m/s)
      
      # Enhanced configuration
      thresholds:
        surface: 15.0    # 10m wind speed threshold
        upper: 20.0      # 850hPa wind speed threshold
        default: 20.0    # Default threshold for other levels
      
      polar_filtering:
        enabled: true
        exclusion_radius: 2.0  # Radius around North Pole to exclude (degrees)
      
      window_size: 3
      smooth_sigma: 1.5
    pressure_laplacian:
      enabled: true
      weight: 0.20
      laplacian_threshold: 0.0002  # Threshold for pressure Laplacian (Pa/km²)
      smooth_sigma: 3  # Smoothing parameter for pressure field
      window_size: 3  # Window size for finding local maxima
    size_filter:
      enabled: true
      weight: 0.2
  multi_criteria_validator:
    # Overall validation threshold (0.0-1.0)
    validation_threshold: 0.7
    # Minimum distance for multi-center filtering (km)
    multi_center_distance: 150.0
    # Criteria thresholds for scoring
    thresholds:
      pressure_minimum:
        very_strong: 980   # hPa
        strong: 990        # hPa
        moderate: 1000     # hPa
        weak: 1010         # hPa
      vorticity:
        very_strong: 5.0e-5  # 1/s
        strong: 3.0e-5       # 1/s
        moderate: 1.0e-5     # 1/s
        weak: 5.0e-6         # 1/s
      size_filter:
        optimal_min: 100     # km
        optimal_max: 800     # km
        extended_min: 50     # km
        extended_max: 1000   # km
      wind_threshold:
        very_strong: 20      # m/s
        strong: 20           # m/s
        moderate: 18         # m/s
        weak: 15             # m/s
      wind_850hPa:
        # Thresholds for wind speed at 850 hPa (m/s)
        very_strong: 25.0    # m/s
        strong: 20.0         # m/s
        moderate: 15.0       # m/s
        weak: 10.0           # m/s
      pressure_gradient:
        very_strong: 2.5     # hPa/100km
        strong: 1.3          # hPa/100km
        moderate: 1.0        # hPa/100km
        weak: 0.7            # hPa/100km
  tracking:
    max_distance: 300.0  # Maximum distance between timesteps (km)
    max_pressure_change: 8.0  # Maximum pressure change between timesteps (hPa)
    max_time_gap: 9  # Maximum gap in hours between detections
    min_duration: 6.0  # Minimum track duration (hours)
    min_points: 3  # Minimum number of points in a valid track

# Visualization settings
visualization:
  default_projection: 'NorthPolarStereo'  # Polar stereographic projection
  map_resolution: 'intermediate'  # Map resolution (low, intermediate, high)
  output_dir: 'output/figures'
  default_dpi: 300
  cyclone_marker_size: 30
  track_line_width: 1.5
  color_map: 'viridis'  # Default colormap for heatmaps
  map_features:
    coastlines: true
    countries: true
    grid_lines: true
    grid_labels: true

# Export settings
export:
  output_dir: 'output/data'
  formats: ['csv', 'netcdf']
  default_format: 'csv'
  csv:
    delimiter: ','
    include_header: true
  netcdf:
    compression_level: 4
    include_metadata: true


tracking:
  # Основные параметры трекинга
  max_distance: 600.0        # км - максимальное расстояние между точками
  max_time_gap: 18.0         # часы - максимальный временной разрыв
  max_pressure_change: 25.0  # гПа - максимальное изменение давления
  min_track_duration: 12.0   # часы - минимальная длительность трека
  min_track_points: 4        # минимальное количество точек в треке
  
  # Debug опции
  debug_save_csv: false      # сохранять ли debug CSV файлы
  debug_dir: "debug"         # директория для debug файлов
  
  # Алгоритм трекинга
  algorithm: "nearest_neighbor"  # алгоритм связывания точек
  cost_weights:              # веса для расчета стоимости связывания
    distance: 1.0
    time: 1.0
    pressure: 0.5
